# The daily service: run the pulse once a day and publish pulse.json.
#
# The app reads the committed file over raw.githubusercontent.com (see
# PulseFeed in the app). No server, no keys — a schedule and a commit.
name: pulse
on:
  schedule:
    - cron: "17 9 * * *"     # 09:17 UTC: 02:17–05:17 across the US, so the date is right everywhere
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 pulse.py
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          PULSE_COUNTRY: US
          PULSE_TZ: America/New_York
      - run: |
          git config user.name "pulse"
          git config user.email "pulse@users.noreply.github.com"
          git add pulse.json
          git diff --cached --quiet || git commit -m "pulse: $(date -u +%F)"
          git push
